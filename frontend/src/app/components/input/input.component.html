<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Pesquisar reserva -->
<div id="pesquisa-container">
  <!-- Caixa de Seleção do Segmento -->
  <select id="select-segmento" [(ngModel)]="segmentoSelecionado" class="custom-select-segmento">
    <option value="">Selecione o segmento</option>
    <option value="PF">Pessoa Física (PF)</option>
    <option value="PJ">Pessoa Jurídica (PJ)</option>
  </select>

  <input
    type="text"
    placeholder="Pesquisar reserva"
    id="pesquisa"
    maxlength="15"
    [(ngModel)]="numeroReserva"
  />

  <button type="button" id="btn-pesquisar" (click)="buscarReserva()">
    <i class="bi bi-search"></i>
  </button>

  <button type="button" id="btn-limpar" (click)="limparTela()">
    <p>Limpar tela</p>
  </button>
</div>

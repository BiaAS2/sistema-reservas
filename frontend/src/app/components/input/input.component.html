<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!--- Pesquisar reserva -->
<div id="pesquisa-container">
  <input type="text" placeholder="Pesquisar reserva" id="pesquisa" maxlength="12" [(ngModel)]="numeroReserva" />

  <button type="button" id="btn-pesquisar" (click)="buscarReserva()">
    <i class="bi bi-search"></i>
  </button>

  <button type="button" id="btn-limpar" (click)="limparTela()">
    <p>Limpar tela</p>
  </button>
</div>
